name: Verify code and released evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_release.py results/20261114
