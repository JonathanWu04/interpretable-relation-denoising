[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretable-relation-denoising"
version = "1.0.0"
description = "CPU-only relation-label denoising with explicit quality and retention trade-offs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.4,<1.8", "joblib>=1.3"]

[project.optional-dependencies]
report = ["reportlab>=4", "pypdf>=4"]
test = ["pytest>=7"]

[project.scripts]
relden = "relden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

